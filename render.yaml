# Render Blueprint for staging (step 4.11, A7 / OQ-33). Region: Frankfurt (EU), ADR-0002.
# Nothing here is created until the owner connects the repository in the Render dashboard
# ("New → Blueprint"). Secrets are set in the dashboard, never in this file.
# Runbook: docs/ops/deploy-runbook.md
services:
  - type: web
    name: grooverift-staging
    runtime: node
    region: frankfurt
    plan: 0.5c-512mb # formerly "starter"
    branch: main
    # NODE_ENV=production makes `npm ci` skip devDependencies; the build needs TypeScript and Tailwind.
    buildCommand: npm ci --include=dev && npm run build
    preDeployCommand: npm run db:migrate && npm run db:seed-genres # the genre list is reference data (D-096)
    startCommand: npm run start
    healthCheckPath: /manifest.webmanifest
    autoDeployTrigger: checksPass # deploy only after GitHub Actions is green
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: APP_URL
        value: https://grooverift-staging.onrender.com # change after the first deploy if Render gives another host
      - key: DATABASE_URL
        fromDatabase:
          name: grooverift-staging-db
          property: connectionString
      - key: BETTER_AUTH_SECRET
        sync: false # Render generates only 32 hex characters; the guard needs 43+: paste `node -e "console.log(require('crypto').randomBytes(32).toString('base64'))"`
      - key: IP_HEADERS
        value: x-forwarded-for
      - key: SENTRY_DSN
        sync: false # error tracking, Sentry EU (D-111); set by hand on web and worker
      - key: SENTRY_ENVIRONMENT
        value: staging
      - key: EMAIL_TRANSPORT
        sync: false # set once the provider is chosen (A7); production refuses to start without one
      - key: EMAIL_FROM
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false

  - type: worker
    name: grooverift-staging-worker
    runtime: node
    region: frankfurt
    plan: 0.5c-512mb # formerly "starter"
    branch: main
    buildCommand: npm ci --include=dev # without dev, drizzle-kit's nested esbuild loses its platform binary
    startCommand: npm run worker
    autoDeployTrigger: checksPass # deploy only after GitHub Actions is green
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: APP_URL
        value: https://grooverift-staging.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: grooverift-staging-db
          property: connectionString
      - key: BETTER_AUTH_SECRET
        sync: false # paste the same value as the web service (the audit IP hash key)
      - key: IP_HEADERS
        value: x-forwarded-for # the worker serves no requests, but the shared production guard requires it
      - key: SENTRY_DSN
        sync: false # error tracking, Sentry EU (D-111); set by hand on web and worker
      - key: SENTRY_ENVIRONMENT
        value: staging
      - key: EMAIL_TRANSPORT
        sync: false # the worker mails the Daily Drop staff alerts (step 5.6)
      - key: EMAIL_FROM
        sync: false

databases:
  - name: grooverift-staging-db
    region: frankfurt
    plan: 0.1c-256mb # formerly "basic-256mb"
    postgresMajorVersion: "17"
