name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22
  DATABASE_URL: postgres://grooverift:grooverift@localhost:5432/grooverift
  APP_URL: http://localhost:3000
  BETTER_AUTH_SECRET: ci-only-secret-not-used-anywhere-else-0000000000 # 48 chars: production refuses fewer than 43 (src/lib/env.ts)

jobs:
  checks:
    name: Lint, types, tokens, messages, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run tokens:check
      - run: npm run i18n:check
      - run: npm run test
      - name: Dependency audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high

  database:
    name: Migrations and database tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: grooverift
          POSTGRES_PASSWORD: grooverift
          POSTGRES_DB: grooverift
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U grooverift"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Migrations are committed and current
        run: npm run db:generate -- --name ci_check && git diff --exit-code --stat -- drizzle
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npm run test:db

  e2e:
    name: Build and end-to-end (axe-core)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: grooverift
          POSTGRES_PASSWORD: grooverift
          POSTGRES_DB: grooverift
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U grooverift"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run db:seed
      # Step 5.12: a throwaway VAPID pair made for this run only (no account, never committed), so the push
      # screens and the reminder step exist during the end-to-end run; the browser side is a stand-in.
      - name: Throwaway VAPID pair
        run: node -e "const k=require('web-push').generateVAPIDKeys();console.log('VAPID_PUBLIC_KEY='+k.publicKey);console.log('VAPID_PRIVATE_KEY='+k.privateKey)" >> "$GITHUB_ENV"
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: true
          EMAIL_TRANSPORT: file
          E2E_EMAIL_FILE: "1"
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
